name: Events V2 pilot tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/lib/integrations/local-events/**'
      - 'app/api/integrations/local-events/**'
      - 'app/HomePageClient.tsx'
      - 'tests/*events*.test.mjs'
      - '.github/workflows/events-v2-pilot.yml'
  push:
    branches: [feat/nationwide-events-pilot]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
