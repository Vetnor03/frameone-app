name: RE:MIND editorial stress audit
on:
  push:
    branches:
      - feat/editorial-responsive-system
    paths:
      - 'app/lib/editorialComposition.mjs'
      - 'app/lib/editorialGridLab.mjs'
      - 'app/lib/editorialFrameLayout.mjs'
      - 'scripts/editorial-stress-audit.mjs'
      - '.github/workflows/editorial-stress-audit.yml'
  pull_request:
    paths:
      - 'app/lib/editorialComposition.mjs'
      - 'app/lib/editorialGridLab.mjs'
      - 'app/lib/editorialFrameLayout.mjs'
      - 'scripts/editorial-stress-audit.mjs'
      - '.github/workflows/editorial-stress-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Exhaustive grids, unusual content and randomized stress tests
        run: node scripts/editorial-stress-audit.mjs
        env:
          EDITORIAL_STRESS_SEEDS: '3000'
      - name: Save reproducible seeds and review summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editorial-stress-report
          path: artifacts/editorial/stress-summary.json
          if-no-files-found: ignore
