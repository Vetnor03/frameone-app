name: Temporary Ski MET summary

on:
  push:
    branches:
      - feature/ski-met-summary
    paths:
      - .github/workflows/temp-ski-met-summary.yml

permissions:
  contents: write

jobs:
  update-ski-met:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ski-met-summary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire Ski tab to MET summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/HomePageClient.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const startMarker = 'function SkiModuleSettingsTab({'
          const endMarker = 'type CountdownItem = {'
          const start = source.indexOf(startMarker)
          const end = source.indexOf(endMarker, start)
          if (start < 0 || end < 0 || end <= start) throw new Error('Could not locate Ski settings block')
          const replacement = Buffer.from('','base64').toString('utf8')
          source = source.slice(0, start) + replacement + source.slice(end)
          fs.writeFileSync(path, source)
          NODE

      - name: Verify TypeScript
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit Ski MET UI and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-ski-met-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx .github/workflows/temp-ski-met-summary.yml
          git diff --cached --check
          git commit -m "Show MET weather in Ski tab"
          git push origin HEAD:feature/ski-met-summary
