name: Temporary powder null verifier

on:
  push:
    branches:
      - fix/ski-powder-null-altitude

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply null fix
        run: python .github/scripts/temp_powder_null_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify null stays null
        run: |
          node <<'NODE'
          function finiteNumber(value) { const number = Number(value); return Number.isFinite(number) ? number : null }
          const resort = { forecast_lat: 60.656364, forecast_lon: 6.416619, top_elevation_m: null }
          const explicitElevation = resort.top_elevation_m == null ? null : finiteNumber(resort.top_elevation_m)
          if (explicitElevation !== null) throw new Error(`expected null, got ${explicitElevation}`)
          console.log('missing Fnugg elevation -> null fallback OK')
          NODE
      - name: Commit verified fix and remove temporary files
        run: |
          rm -f .github/workflows/temp-powder-null-verify.yml .github/scripts/temp_powder_null_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/ski/summary/route.ts .github/workflows/temp-powder-null-verify.yml .github/scripts/temp_powder_null_fix.py
          git commit -m "Fix missing resort elevation in powder forecast"
          git push
