name: Temporary Ski tab location shell

on:
  push:
    branches:
      - feature/ski-tab-location-shell
    paths:
      - .github/workflows/temp-ski-tab-location-shell.yml

permissions:
  contents: write

jobs:
  update-ski-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ski-tab-location-shell
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Ski location tab shell
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Verify TypeScript
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit Ski tab shell and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-ski-tab-location-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx .github/workflows/temp-ski-tab-location-shell.yml
          git diff --cached --check
          git commit -m "Add Weather-style Ski location tab"
          git push origin HEAD:feature/ski-tab-location-shell
