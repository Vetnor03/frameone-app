name: Date + Weather editorial preview build

on:
  pull_request:
    paths:
      - 'frame/src/modules/ModuleDate.cpp'
      - 'frame/src/modules/ModuleWeather.cpp'
      - 'frame/platformio.ini'
      - '.github/workflows/date-weather-editorial-preview.yml'
  workflow_dispatch:

jobs:
  combined-editorial-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile isolated Date + Weather editorial preview
        run: pio run -d frame -e alfred_v1_2_date_weather_editorial_preview
      - name: Show preview firmware size
        run: pio run -d frame -e alfred_v1_2_date_weather_editorial_preview -t size
      - name: Compile matching standard Alfred rollback
        run: pio run -d frame -e alfred_v1_2
      - name: Stage UNFLASHED preview binaries
        run: |
          mkdir -p preview-artifact/preview preview-artifact/rollback-standard
          cp frame/.pio/build/alfred_v1_2_date_weather_editorial_preview/firmware.bin preview-artifact/preview/
          cp frame/.pio/build/alfred_v1_2_date_weather_editorial_preview/bootloader.bin preview-artifact/preview/
          cp frame/.pio/build/alfred_v1_2_date_weather_editorial_preview/partitions.bin preview-artifact/preview/
          cp frame/.pio/build/alfred_v1_2/firmware.bin preview-artifact/rollback-standard/
          cp frame/.pio/build/alfred_v1_2/bootloader.bin preview-artifact/rollback-standard/
          cp frame/.pio/build/alfred_v1_2/partitions.bin preview-artifact/rollback-standard/
          printf '%s\n'             'RE:MIND Date + Weather editorial preview'             'UNFLASHED / NOT OTA APPROVED'             'Built from PR #1488'             'Use only after explicit V4 flash instruction.'             > preview-artifact/README.txt
      - name: Upload UNFLASHED Date + Weather preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: remind-v4-date-weather-editorial-UNFLASHED
          path: preview-artifact/
          if-no-files-found: error
      - name: No flashing or OTA
        run: echo "Compile-only preview. Do not flash until explicit V4 approval and rollback verification."
