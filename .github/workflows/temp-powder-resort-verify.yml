name: Temporary resort powder verifier

on:
  push:
    branches:
      - feature/ski-next-powder-day-impl

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply resort forecast fix
        run: python .github/scripts/temp_powder_resort_forecast_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify MET resort-point terrain
        run: |
          node <<'NODE'
          async function inspect(label, id) {
            const resort = await fetch(`https://api.fnugg.no/get/resort/${id}?sourceFields=name,location`).then(r => r.json())
            const s = resort?._source
            if (!s?.location) throw new Error(`${label}: missing resort location`)
            const url = new URL('https://api.met.no/weatherapi/locationforecast/2.0/compact')
            url.searchParams.set('lat', Number(s.location.lat).toFixed(4))
            url.searchParams.set('lon', Number(s.location.lon).toFixed(4))
            const r = await fetch(url, {headers:{'User-Agent':'RE:MIND Ski verifier https://re-mind.no'}})
            const p = await r.json()
            if (!r.ok || !Array.isArray(p?.properties?.timeseries)) throw new Error(`${label}: MET failed`)
            console.log(label, s.name, 'model elevation', p?.geometry?.coordinates?.[2] ?? null)
          }
          await inspect('Voss', 17)
          await inspect('Hovden', 11)
          NODE
      - name: Commit verified fix and remove temporary files
        run: |
          rm -f .github/workflows/temp-powder-resort-verify.yml .github/scripts/temp_powder_resort_forecast_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/HomePageClient.tsx app/api/ski/summary/route.ts .github/workflows/temp-powder-resort-verify.yml .github/scripts/temp_powder_resort_forecast_fix.py
          git commit -m "Use resort forecast point for powder estimate"
          git push
