name: Temporary ski-day powder verifier

on:
  push:
    branches:
      - feature/ski-next-powder-day-impl

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ski-day fix
        run: python .github/scripts/temp_powder_ski_day_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify evening snowfall maps to next ski day
        run: |
          node <<'NODE'
          function shiftDate(date, days) {
            const value = new Date(`${date}T12:00:00Z`)
            value.setUTCDate(value.getUTCDate() + days)
            return value.toISOString().slice(0, 10)
          }
          const local = { date: '2026-12-10', hour: 18 }
          const skiDate = local.hour >= 15 ? shiftDate(local.date, 1) : local.date
          if (skiDate !== '2026-12-11') throw new Error(`expected next ski day, got ${skiDate}`)
          console.log('18:00 snowfall ->', skiDate)
          NODE
      - name: Commit verified refinement and remove temporary files
        run: |
          rm -f .github/workflows/temp-powder-ski-day-verify.yml .github/scripts/temp_powder_ski_day_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/HomePageClient.tsx app/api/ski/summary/route.ts .github/workflows/temp-powder-ski-day-verify.yml .github/scripts/temp_powder_ski_day_fix.py
          git commit -m "Count evening snow toward next powder day"
          git push
