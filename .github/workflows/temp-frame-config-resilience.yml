name: Temporary frame-config resilience verifier

on:
  push:
    branches:
      - fix/frame-config-transient-resilience

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply firmware resilience patch
        run: python .github/scripts/temp_frame_config_resilience.py
      - name: Install app dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck app route
        run: npm run typecheck
      - name: Verify firmware guardrails
        run: |
          grep -q 'frame-config still unavailable; preserving existing e-paper content' frame/src/frame_v2.5.1.ino
          grep -q 'const uint32_t retryDelaysMs\[\] = {2000UL, 5000UL};' frame/src/frame_v2.5.1.ino
          if grep -q 'ScreenPairing::showError("Could not load frame")' frame/src/frame_v2.5.1.ino; then
            echo 'Fatal transient frame-config screen still present'
            exit 1
          fi
      - name: Commit verified patch and remove temporary verifier
        run: |
          rm -f .github/workflows/temp-frame-config-resilience.yml .github/scripts/temp_frame_config_resilience.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frame/src/frame_v2.5.1.ino app/api/device/frame-config/route.ts .github/workflows/temp-frame-config-resilience.yml .github/scripts/temp_frame_config_resilience.py
          git commit -m "Preserve dashboard on transient frame-config failure"
          git push
