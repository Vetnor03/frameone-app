name: Temporary Ski picker update

on:
  push:
    branches:
      - fix/ski-picker-even-grid
    paths:
      - .github/workflows/temp-ski-picker-even-grid.yml

permissions:
  contents: write

jobs:
  update-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ski-picker-even-grid
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Ski module picker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/HomePageClient.tsx'
          let source = fs.readFileSync(path, 'utf8')

          function replaceExact(oldText, newText, label) {
            const parts = source.split(oldText)
            if (parts.length !== 2) {
              throw new Error(`${label}: expected exactly one match, found ${parts.length - 1}`)
            }
            source = parts.join(newText)
          }

          replaceExact(
            "type ModuleKey = 'assistant' | 'date' | 'weather' | 'surf' | 'reminders' | 'countdown' | 'soccer' | 'stocks' | 'groceries'",
            "type ModuleKey = 'assistant' | 'date' | 'weather' | 'surf' | 'ski' | 'reminders' | 'countdown' | 'soccer' | 'stocks' | 'groceries'",
            'ModuleKey'
          )

          const surfLabel = "      surf: 'SURF',\n"
          const surfMatches = source.split(surfLabel).length - 1
          if (surfMatches !== 2) {
            throw new Error(`module labels: expected 2 SURF labels, found ${surfMatches}`)
          }
          source = source.replaceAll(surfLabel, "      surf: 'SURF',\n      ski: 'SKI',\n")

          replaceExact(
            "  const prominentOption: ModuleKey = 'assistant'\n  const options: ModuleKey[] = ['reminders', 'date', 'weather', 'countdown', 'surf', 'soccer', 'groceries', 'stocks']",
            "  const options: ModuleKey[] = ['assistant', 'reminders', 'date', 'weather', 'countdown', 'surf', 'ski', 'soccer', 'groceries', 'stocks']",
            'module picker options'
          )

          replaceExact(
            `          <button\n            key={prominentOption}\n            onClick={() => onPick(prominentOption)}\n            className="col-span-2 min-h-11 rounded-2xl border border-[color:var(--bd-10)] px-4 py-3 text-sm text-[color:var(--fg-80)] tracking-widest transition hover:border-[color:var(--bd-30)] hover:text-[color:var(--fg)]"\n          >\n            {moduleLabel(language, prominentOption)}\n          </button>\n`,
            '',
            'prominent AI Assistant card'
          )

          fs.writeFileSync(path, source)
          NODE

      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck

      - name: Commit UI change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-ski-picker-even-grid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx .github/workflows/temp-ski-picker-even-grid.yml
          git diff --cached --check
          git commit -m "Add Ski to module picker and restore even grid"
          git push origin HEAD:fix/ski-picker-even-grid
