name: Temporary Ski picker update

on:
  push:
    branches:
      - fix/ski-picker-even-grid
    paths:
      - .github/workflows/temp-ski-picker-even-grid.yml

jobs:
  locate-frame-module-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ski-picker-even-grid
      - name: Locate FrameModuleKey
        run: |
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git "FrameModuleKey" . || true
