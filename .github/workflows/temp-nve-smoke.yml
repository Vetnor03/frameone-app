name: Temporary NVE snow smoke test

on:
  push:
    branches:
      - fix/ski-senorge-snow

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live SeNorge snow themes
        run: |
          node <<'NODE'
          const x = 68838
          const y = 6627251
          const end = new Date().toISOString().slice(0, 10)
          const startDate = new Date(Date.now() - 10 * 86400000).toISOString().slice(0, 10)
          for (const theme of ['sd', 'sdfsw', 'sdfsw3d']) {
            const url = `https://gts.nve.no/api/GridTimeSeries/${x}/${y}/${startDate}/${end}/${theme}.json`
            const response = await fetch(url)
            const body = await response.text()
            console.log(theme, response.status, body.slice(0, 1200))
            if (!response.ok) process.exitCode = 1
          }
          NODE
