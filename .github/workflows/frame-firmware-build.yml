name: Frame firmware build

on:
  pull_request:
    paths:
      - "frame/**"
      - ".github/workflows/frame-firmware-build.yml"
  workflow_dispatch:

jobs:
  live-backend-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify live re-mind.no TLS using firmware CA bundle
        run: python3 frame/tools/check_backend_tls.py
      - name: Check public Ably MQTT broker TLS (no credentials)
        run: |
          python3 - <<'PY'
          import socket
          import ssl

          hostname = "main.mqtt.ably.net"
          context = ssl.create_default_context()
          with socket.create_connection((hostname, 8883), timeout=12) as sock:
              with context.wrap_socket(sock, server_hostname=hostname) as secured:
                  certificate = secured.getpeercert()
                  assert certificate and secured.version().startswith("TLS")
                  print("Ably MQTT TLS: verified hostname, server certificate and trusted chain")
                  print("TLS:", secured.version())
                  print("Subject:", certificate.get("subject"))
                  print("Issuer:", certificate.get("issuer"))
                  print("Valid until:", certificate.get("notAfter"))
          PY
          timeout 15 openssl s_client -connect main.mqtt.ably.net:8883 \
            -servername main.mqtt.ably.net -showcerts </dev/null 2>&1 \
            | grep -E '^ *(depth|[0-9]+ s:|[0-9]+ i:|verify return:|Verify return code:)' \
            | head -30

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19 pytest
      - run: pytest -q frame/tests
      - run: pio run -v -d frame -e alfred_v1_2
      # TEMP_REFRESH_AUDIT: compile the gated diagnostic code until removal.
      - run: pio run -d frame -e alfred_v1_2_refresh_audit
      # Countdown-only R2 candidate, compiled but never flashed or deployed.
      - run: pio run -d frame -e alfred_v1_2_countdown_r2_preview
      # Keep this binary separated from normal firmware and OTA artifacts.
      # USB test only; publishing, flashing and pairing are never CI actions.
      - name: Package isolated Countdown V4 USB test firmware
        run: |
          set -euo pipefail
          profile="frame/.pio/build/alfred_v1_2_countdown_r2_preview"
          out="$RUNNER_TEMP/countdown-v4-usb"
          mkdir -p "$out"
          test -s "$profile/firmware.bin"
          for file in firmware.bin bootloader.bin partitions.bin boot_app0.bin; do
            if test -s "$profile/$file"; then cp "$profile/$file" "$out/$file"; fi
          done
          cp frame/partitions_alfred_16mb.csv "$out/partition-layout.csv"
          git rev-parse HEAD > "$out/source-commit.txt"
          sha256sum "$out/"*.bin > "$out/SHA256SUMS.txt"
          cat > "$out/READ_ME_FIRST.txt" <<'EOF'
          RE:MIND Countdown Design vNext R3.1 -- USB TEST ONLY
          Source: draft GitHub PR #1522, NOT main and NOT an OTA release.
          Target: verified ESP32-S3 N16R8 Alfred V1.2 / RE:MIND V4 hardware.
          Build profile: alfred_v1_2_countdown_r2_preview, editorial flag ON.
          Standard Alfred firmware: unchanged; frame identity is not baked in.

          SAFE RECOMMENDED USB TEST
          1. Use the isolated USB test frame, connect it by USB.
          2. Download the PR source/branch, install PlatformIO if necessary.
          3. In a terminal opened at repository root, with the correct COM port:
             pio run -d frame -e alfred_v1_2_countdown_r2_preview -t upload --upload-port COM5
             (replace COM5 with the actual USB port)
          4. Serial monitor: pio device monitor --port COM5 -b 115200
          5. Use the existing custom-layout interface and select Countdown
             in 1x1 through 4x4 footprints; check Light and Dark.
          6. Photograph any questionable geometry against the passepartout.

          Preserve NVS and the stored pairing; do NOT Erase All Flash.
          The ZIP's .bin files are build verification artifacts, NOT a
          one-click OTA update or an instruction to overwrite active flash.
          Do not write arbitrary offsets with esptool or use legacy
          frame_esp32 binaries on this S3 hardware. No pilot fleet updates.
          Nothing is flashed from GitHub Actions.
          EOF
      - name: Archive Countdown USB-only candidate (unflashed)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: countdown-v4-r3_1-usb-test-unflashed
          path: ${{ runner.temp }}/countdown-v4-usb/
          if-no-files-found: error
          retention-days: 14
      - run: pio run -d frame -e frame_esp32
      - run: pio run -d frame -e alfred_v1_2 -t size

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install pinned Arduino toolchain
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "GxEPD2@1.6.4"
          arduino-cli lib install "PubSubClient@2.8"
      - name: Prepare flat Arduino IDE sketch
        run: python frame/tools/prepare_arduino_sketch.py --output "$RUNNER_TEMP/frame_v2.5.1"
      - name: Compile Alfred with Arduino CLI
        run: |
          arduino-cli compile --verbose --warnings default --export-binaries \
            --fqbn "esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            "$RUNNER_TEMP/frame_v2.5.1"
      - name: Prepare isolated Countdown R3.1 Arduino IDE sketch
        run: |
          python frame/tools/prepare_arduino_sketch.py \
            --output "$RUNNER_TEMP/countdown-arduino/frame_v2.5.1" \
            --countdown-preview
      - name: Compile Countdown R3.1 preview with Arduino CLI
        run: |
          arduino-cli compile --verbose --warnings default --export-binaries \
            --fqbn "esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            "$RUNNER_TEMP/countdown-arduino/frame_v2.5.1"
      - name: Create familiar Arduino sketch ZIP (folder plus ino)
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/countdown-arduino/frame_v2.5.1/frame_v2.5.1.ino"
          test -s "$RUNNER_TEMP/countdown-arduino/frame_v2.5.1/partitions.csv"
          grep -q '^#define REMIND_COUNTDOWN_EDITORIAL_PREVIEW_ENABLED 1' \
            "$RUNNER_TEMP/countdown-arduino/frame_v2.5.1/ModuleCountdown.cpp"
          (cd "$RUNNER_TEMP/countdown-arduino" && \
            zip -qr "$RUNNER_TEMP/RE-MIND-Countdown-V4-Arduino-IDE.zip" frame_v2.5.1)
      - name: Archive Countdown Arduino IDE ZIP for manual USB flashing only
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: countdown-v4-r3_1-arduino-ide-flash-zip
          path: ${{ runner.temp }}/RE-MIND-Countdown-V4-Arduino-IDE.zip
          if-no-files-found: error
          retention-days: 14
      - name: Archive normal Alfred Arduino sketch (MQTT included)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alfred-v1_2-standard-arduino-sketch-unflashed
          path: ${{ runner.temp }}/frame_v2.5.1/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unflashed Alfred USB test candidate
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alfred-v1_2-standard-compiled-unflashed
          path: ${{ runner.temp }}/frame_v2.5.1/
          if-no-files-found: error
          retention-days: 7

  countdown-r3-native:
    name: Countdown R3 native 1-bit gallery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image assembly dependency (labels only)
        run: python3 -m pip install Pillow==11.3.0
      - name: Compile genuine renderer and check 16 sizes x two themes
        run: python3 frame/tools/countdown_r3_native.py --output "$RUNNER_TEMP/countdown-r3"
      - name: Keep unflashed native 1-bit QA artwork and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countdown-r3-native-gallery-unflashed
          path: ${{ runner.temp }}/countdown-r3/
          if-no-files-found: warn
          retention-days: 14
