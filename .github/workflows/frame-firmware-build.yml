name: Frame firmware build

on:
  pull_request:
    paths:
      - "frame/**"
      - ".github/workflows/frame-firmware-build.yml"
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19 pytest
      - run: pytest -q frame/tests
      - run: pio run -v -d frame -e alfred_v1_2
      # TEMP_REFRESH_AUDIT: compile the gated diagnostic code until removal.
      - run: pio run -d frame -e alfred_v1_2_refresh_audit
      - run: pio run -d frame -e frame_esp32
      - run: pio run -d frame -e alfred_v1_2 -t size

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install production Arduino toolchain
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "GxEPD2@1.6.4"

      - name: Cache production PM-enabled S3 libraries
        id: pm-sdk-cache
        uses: actions/cache@v4
        with:
          path: .cache/remind-pm-sdk
          key: remind-pm-arduino-3.3.11-idf-b774170f-${{ hashFiles('frame/tools/production_pm/**') }}

      - name: Install PM library-builder prerequisites
        if: steps.pm-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison gperf ninja-build ccache cmake \
            libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Build production PM-enabled ESP32-S3 libraries
        if: steps.pm-sdk-cache.outputs.cache-hit != 'true'
        env:
          PM_DIST_DIR: ${{ github.workspace }}/.cache/remind-pm-sdk
        run: bash frame/tools/production_pm/build_pm_libraries.sh

      - name: Prepare flat Arduino IDE sketch
        run: python frame/tools/prepare_arduino_sketch.py --output "$RUNNER_TEMP/frame_v2.5.1"

      - name: Inject verified PM-enabled S3 libraries
        run: |
          FQBN="esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc"
          SDK_PATH="$(arduino-cli compile --fqbn "$FQBN" --show-properties "$RUNNER_TEMP/frame_v2.5.1" \
            | sed -n 's/^compiler.sdk.path=//p' | head -n 1)"
          if [ -z "$SDK_PATH" ]; then
            echo "Could not resolve Arduino ESP32-S3 SDK path" >&2
            exit 1
          fi
          echo "Arduino ESP32-S3 SDK path: $SDK_PATH"

          rm -rf "$SDK_PATH"
          mkdir -p "$(dirname "$SDK_PATH")"
          cp -a "$GITHUB_WORKSPACE/.cache/remind-pm-sdk/esp32s3" "$SDK_PATH"

          test -d "$SDK_PATH/qio_opi"
          grep -R -E -q "^(#define CONFIG_PM_ENABLE 1|CONFIG_PM_ENABLE=y)$" "$SDK_PATH"
          grep -R -E -q "^(#define CONFIG_FREERTOS_USE_TICKLESS_IDLE 1|CONFIG_FREERTOS_USE_TICKLESS_IDLE=y)$" "$SDK_PATH"

      - name: Compile production Alfred with Arduino CLI + PM libraries
        run: |
          arduino-cli compile --verbose --warnings default --export-binaries \
            --fqbn "esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            "$RUNNER_TEMP/frame_v2.5.1"
