name: Frame firmware build

on:
  pull_request:
    paths:
      - "frame/**"
      - ".github/workflows/frame-firmware-build.yml"
  workflow_dispatch:

jobs:
  live-backend-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify live re-mind.no TLS using firmware CA bundle
        run: python3 frame/tools/check_backend_tls.py
      - name: Check public Ably MQTT broker TLS (no credentials)
        run: |
          python3 - <<'PY'
          import socket
          import ssl

          hostname = "main.mqtt.ably.net"
          context = ssl.create_default_context()
          with socket.create_connection((hostname, 8883), timeout=12) as sock:
              with context.wrap_socket(sock, server_hostname=hostname) as secured:
                  certificate = secured.getpeercert()
                  assert certificate and secured.version().startswith("TLS")
                  print("Ably MQTT TLS: verified hostname, server certificate and trusted chain")
                  print("TLS:", secured.version())
                  print("Subject:", certificate.get("subject"))
                  print("Issuer:", certificate.get("issuer"))
                  print("Valid until:", certificate.get("notAfter"))
          PY
          timeout 15 openssl s_client -connect main.mqtt.ably.net:8883 \
            -servername main.mqtt.ably.net -showcerts </dev/null 2>&1 \
            | grep -E '^ *(depth|[0-9]+ s:|[0-9]+ i:|verify return:|Verify return code:)' \
            | head -30

  date-visual-review:
    # Independent, nonflash QA artifact; NEVER publishes a firmware binary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate phase-0 Date physical aperture reference (UNMEASURED V4)
        run: python3 frame/tools/generate_date_aperture_reference.py --output "$RUNNER_TEMP/date-vnext-aperture-reference.svg"
      - name: Upload Date physical aperture reference (NOT PANEL PHOTO OR FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-phase0-aperture-reference-unflashed
          path: ${{ runner.temp }}/date-vnext-aperture-reference.svg
          if-no-files-found: error
          retention-days: 7
      - name: Generate actual F1 bitmap Date review (16 sizes + 100 placements)
        run: python3 frame/tools/generate_date_review_gallery.py --output "$RUNNER_TEMP/date-vnext-review.html"
      - name: Upload standalone visual review HTML (NOT frame output)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-original-gfx-visual-review-unflashed
          path: ${{ runner.temp }}/date-vnext-review.html
          if-no-files-found: error
          retention-days: 7
      - name: Generate full editorial 4x4 two-month and holiday review
        run: python3 frame/tools/generate_date_dual_holiday_gallery.py --output "$RUNNER_TEMP/date-vnext-dual-holiday.html"
      - name: Upload dual-month and holiday visual comparison (NOT frame output)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-dual-holiday-review-unflashed
          path: ${{ runner.temp }}/date-vnext-dual-holiday.html
          if-no-files-found: error
          retention-days: 7
      - name: Generate physical-grid mixed Date ink study (NOT module/frame capture)
        run: python3 frame/tools/generate_date_mixed_layout_review.py --output "$RUNNER_TEMP/date-vnext-mixed-layout.html"
      - name: Upload real-grid mixed Date review (UNFLASHED)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-mixed-layout-ink-study-unflashed
          path: ${{ runner.temp }}/date-vnext-mixed-layout.html
          if-no-files-found: error
          retention-days: 7
      - name: Compile real native Date painter and capture host 1-bit pixels (NOT GxEPD2 hardware)
        run: python3 frame/tools/generate_date_native_painter_capture.py --output "$RUNNER_TEMP/date-native-cpp-capture.html"
      - name: Upload actual C++ Date paint-call host capture (NO FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-native-cpp-painter-1bit-unflashed
          path: ${{ runner.temp }}/date-native-cpp-capture.html
          if-no-files-found: error
          retention-days: 7
      - name: Render actual C++ compact Date 1-bit host gallery (SEPARATE DEFAULT-OFF FLAG)
        run: python3 frame/tools/generate_date_compact_native_review.py --output "$RUNNER_TEMP/date-native-compact"
      - name: Upload C++ compact micro/ribbon screenshots (NOT PHYSICAL PANEL)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-compact-micro-ribbon-native-unflashed
          path: ${{ runner.temp }}/date-native-compact/
          if-no-files-found: error
          retention-days: 7
      - name: Audit actual native Date admission in all 11 mixed-layout scenarios (NOT full other-module paint)
        run: python3 frame/tools/audit_date_native_mixed_parity.py --output "$RUNNER_TEMP/date-native-mixed-admission.json"
      - name: Upload mixed SVG/native C++ admission comparison (NOT panel capture)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-mixed-native-vs-source-admission-unflashed
          path: ${{ runner.temp }}/date-native-mixed-admission.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture native Date into independent 48000-byte GxEPD2-style host buffer (NOT controller RAM)
        run: python3 frame/tools/generate_date_gxepd_packed_evidence.py --output "$RUNNER_TEMP/date-gxepd-packed"
      - name: Upload host-only packed bytes and parity manifest (NO FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-gxepd-compatible-host-48k-unflashed
          path: ${{ runner.temp }}/date-gxepd-packed/
          if-no-files-found: error
          retention-days: 7
      - name: Run exact upstream GxEPD2_BW v1.6.4 class against real Date host pixels (mock T7, NO SPI)
        run: python3 frame/tools/generate_date_real_gxepd_bw_capture.py --output "$RUNNER_TEMP/date-real-bw-host"
      - name: Upload actual GxEPD2_BW class host transfers (NOT a physical panel capture)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-real-gxepd2-bw-mock-t7-unflashed
          path: ${{ runner.temp }}/date-real-bw-host/
          if-no-files-found: error
          retention-days: 7
      - name: Paint actual Date directly with pinned Adafruit_GFX and GxEPD2_BW (mock T7, NO SPI)
        run: python3 frame/tools/generate_date_direct_gfx_bw_capture.py --output "$RUNNER_TEMP/date-direct-gfx-bw"
      - name: Upload direct Adafruit_GFX to GxEPD2_BW pixel comparison (NOT panel capture)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-direct-gfx-bw-original-cpp-unflashed
          path: ${{ runner.temp }}/date-direct-gfx-bw/
          if-no-files-found: error
          retention-days: 7
      - name: Validate all mixed Date slots via real C++ Adafruit GFX and GxEPD2 BW (NO OTHER MODULES)
        run: python3 frame/tools/generate_date_mixed_original_gfx_bw.py --output "$RUNNER_TEMP/date-mixed-original-gfx-bw"
      - name: Upload mixed Date-only original GFX/BW captures and audit (NO FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-mixed-original-gfx-bw-date-only-unflashed
          path: ${{ runner.temp }}/date-mixed-original-gfx-bw/
          if-no-files-found: error
          retention-days: 7
      - name: Draw real Date plus real News with seeded offline headlines (original GFX/BW; NO SPI)
        run: python3 frame/tools/generate_date_news_real_gfx_bw.py --output "$RUNNER_TEMP/date-real-news-gfx-bw"
      - name: Upload genuine Date + News synthetic-feed pixel proof (NOT physical panel)
        uses: actions/upload-artifact@v4
        with:
          name: date-vnext-genuine-news-and-date-unflashed
          path: ${{ runner.temp }}/date-real-news-gfx-bw/
          if-no-files-found: error
          retention-days: 7

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19 pytest
      - run: pytest -q frame/tests
      - run: pio run -v -d frame -e alfred_v1_2
      # R3 role-first Date-only opt-in path; compile without flashing.
      - run: pio run -d frame -e alfred_v1_2_date_role_preview
      # R4: isolated Date editorial preview with actual original-F1 GFX paint.
      - run: pio run -d frame -e alfred_v1_2_date_editorial_preview
      # TEMP_REFRESH_AUDIT: compile the gated diagnostic code until removal.
      - run: pio run -d frame -e alfred_v1_2_refresh_audit
      - run: pio run -d frame -e frame_esp32
      - run: pio run -d frame -e alfred_v1_2 -t size

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install pinned Arduino toolchain
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "GxEPD2@1.6.4"
          arduino-cli lib install "PubSubClient@2.8"
      - name: Prepare flat Arduino IDE sketch
        run: python frame/tools/prepare_arduino_sketch.py --output "$RUNNER_TEMP/frame_v2.5.1"
      - name: Compile Alfred with Arduino CLI
        run: |
          arduino-cli compile --verbose --warnings default --export-binaries \
            --fqbn "esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            "$RUNNER_TEMP/frame_v2.5.1"
      - name: Archive normal Alfred Arduino sketch (MQTT included)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alfred-v1_2-standard-arduino-sketch-unflashed
          path: ${{ runner.temp }}/frame_v2.5.1/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unflashed Alfred USB test candidate
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alfred-v1_2-standard-compiled-unflashed
          path: ${{ runner.temp }}/frame_v2.5.1/
          if-no-files-found: error
          retention-days: 7
