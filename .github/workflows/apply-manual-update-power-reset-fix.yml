name: Apply manual update and power reset refresh fix

on:
  push:
    branches:
      - fix/manual-update-power-reset-refresh

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-update-power-reset-refresh
          fetch-depth: 0

      - name: Apply firmware fix
        run: python3 tools/apply_manual_update_power_reset_fix.py

      - name: Run focused firmware regression suite
        run: |
          python3 -m pytest frame/tests/test_live_update.py frame/tests/test_manual_update_power_reset.py -q
          node --test tests/smart-change-driven-refresh.test.mjs tests/smart-refresh-production-wiring.test.mjs
          git diff --check

      - name: Commit fix to branch
        run: |
          rm .github/workflows/apply-manual-update-power-reset-fix.yml
          rm tools/apply_manual_update_power_reset_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frame/src/frame_v2.5.1.ino frame/tests/test_manual_update_power_reset.py .github/workflows/apply-manual-update-power-reset-fix.yml tools/apply_manual_update_power_reset_fix.py
          git commit -m "Restore fast manual updates and full power-edge refresh"
          git push origin HEAD:fix/manual-update-power-reset-refresh
