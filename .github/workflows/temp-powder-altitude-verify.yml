name: Temporary powder altitude verifier

on:
  push:
    branches:
      - feature/ski-next-powder-day-impl

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply altitude fix
        run: python .github/scripts/temp_powder_altitude_fix.py
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify Fnugg resort detail elevations
        run: |
          node <<'NODE'
          async function top(id) {
            const url = new URL(`https://api.fnugg.no/get/resort/${id}`)
            url.searchParams.set('sourceFields', 'name,location,weather_zones,default_weather_zones')
            const r = await fetch(url)
            const p = await r.json()
            if (!r.ok || !p?._source) throw new Error(`resort ${id} detail failed`)
            const s = p._source
            const zones = Array.isArray(s.weather_zones) ? s.weather_zones : []
            const topId = String(s?.default_weather_zones?.top || '')
            const zone = zones.find(z => String(z?.id || '') === topId) || zones.sort((a,b) => Number(b?.elevation || 0) - Number(a?.elevation || 0))[0]
            console.log(id, s.name, 'top', zone?.elevation ?? null, 'zones', zones.length)
          }
          await top(17)
          await top(11)
          NODE
      - name: Commit fix and remove temporary files
        run: |
          rm -f .github/workflows/temp-powder-altitude-verify.yml .github/scripts/temp_powder_altitude_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/ski/summary/route.ts .github/workflows/temp-powder-altitude-verify.yml .github/scripts/temp_powder_altitude_fix.py
          git commit -m "Use resort top altitude for powder estimate"
          git push
