name: Temporary Varsom API inspect

on:
  push:
    branches:
      - fix/ski-varsom-avalanche

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical Varsom problem shape
        run: |
          node <<'NODE'
          const lat = 59.56
          const lon = 7.36
          const dates = ['2026-02-01','2026-02-15','2026-03-01']
          for (const date of dates) {
            const url = `https://api01.nve.no/hydrology/forecast/avalanche/v6.3.2/api/Warning/Coordinate/${lat}/${lon}/2/${date}/${date}`
            const r = await fetch(url, { headers: { Accept: 'application/json' } })
            const data = await r.json().catch(() => null)
            const warning = Array.isArray(data) ? data[0] : null
            console.log('DATE', date, 'STATUS', r.status)
            console.log(JSON.stringify({
              RegionName: warning?.RegionName,
              DangerLevel: warning?.DangerLevel,
              DangerLevelName: warning?.DangerLevelName,
              MainText: warning?.MainText,
              AvalancheProblems: warning?.AvalancheProblems,
              ExposedHeightFill: warning?.ExposedHeightFill,
              ExposedHeight1: warning?.ExposedHeight1,
            }, null, 2).slice(0, 18000))
          }
          NODE
