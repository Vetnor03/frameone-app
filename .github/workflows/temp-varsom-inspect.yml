name: Temporary Varsom avalanche verifier

on:
  push:
    branches:
      - fix/ski-varsom-avalanche

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ski-varsom-avalanche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Varsom avalanche patch
        run: python3 scripts/temp-varsom-patch.py
      - name: Verify TypeScript
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Commit verified change and remove temporary files
        run: |
          rm -f scripts/temp-varsom-patch.py .github/workflows/temp-varsom-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx app/api/ski/summary/route.ts scripts/temp-varsom-patch.py .github/workflows/temp-varsom-inspect.yml
          git commit -m "Add Varsom avalanche data to Ski"
          git push origin HEAD:fix/ski-varsom-avalanche
