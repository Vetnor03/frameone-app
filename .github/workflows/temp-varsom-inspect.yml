name: Temporary Varsom API inspect

on:
  push:
    branches:
      - fix/ski-varsom-avalanche

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Varsom coordinate parameters
        run: |
          node <<'NODE'
          const specUrl = 'https://api01.nve.no/hydrology/forecast/avalanche/v6.3.2/swagger/docs/v6.3.2'
          const spec = await (await fetch(specUrl)).json()
          const path = '/api/AvalancheWarningByCoordinates/Detail/{x}/{y}/{langkey}/{startdate}/{enddate}'
          console.log(JSON.stringify(spec.paths[path], null, 2))
          NODE
