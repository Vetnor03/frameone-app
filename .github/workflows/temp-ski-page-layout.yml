name: Temporary Ski page layout

on:
  push:
    branches:
      - fix/ski-page-layout
    paths:
      - .github/workflows/temp-ski-page-layout.yml
      - scripts/temp-ski-page-layout.js

permissions:
  contents: write

jobs:
  update-ski-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ski-page-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Ski layout patch
        run: node scripts/temp-ski-page-layout.js

      - name: Verify TypeScript
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit layout and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-ski-page-layout.yml scripts/temp-ski-page-layout.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/HomePageClient.tsx .github/workflows/temp-ski-page-layout.yml scripts/temp-ski-page-layout.js
          git diff --cached --check
          git commit -m "Make Ski settings scrollable and roomier"
          git push origin HEAD:fix/ski-page-layout
