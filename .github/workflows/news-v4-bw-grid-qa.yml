name: News V4 B-W GRID 1-16 Arduino IDE QA (NO FLASH)

on:
  pull_request:
    paths:
      - "frame/tests/news_v4_bw_grid/**"
      - "frame/src/modules/NewsEditorialPreview.h"
      - "frame/src/assets/fonts/RemindEditorialFonts.*"
      - ".github/workflows/news-v4-bw-grid-qa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Compile isolated V4 black-and-white News R2 test
        run: pio run -d frame/tests/news_v4_bw_grid -e news_v4_bw_grid
      - name: Prepare same Arduino IDE sketch folder as Surf QA
        run: python frame/tests/news_v4_bw_grid/package_arduino.py
      - name: Independently compile the FINAL packaged Arduino sketch sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2,rmtree
          root=Path("frame/tests/news_v4_bw_grid")
          src=root/"arduino-package/frame_v2.5.1"
          verify=root/"arduino-verify-pio"
          if verify.exists():rmtree(verify)
          (verify/"boards").mkdir(parents=True)
          (verify/"src").mkdir()
          copy2("frame/boards/alfred_v1_2.json",verify/"boards/alfred_v1_2.json")
          copy2(src/"partitions.csv",verify/"partitions.csv")
          for f in src.iterdir():
            if f.suffix in {".cpp",".h"}:copy2(f,verify/"src"/f.name)
          (verify/"src/main.cpp").write_text((src/"frame_v2.5.1.ino").read_text())
          (verify/"platformio.ini").write_text(
            "[platformio]\n"
            "default_envs = verify\n"
            "boards_dir = boards\n"
            "[env:verify]\n"
            "platform = espressif32@6.6.0\n"
            "framework = arduino\n"
            "board = alfred_v1_2\n"
            "board_build.flash_size = 16MB\n"
            "board_build.flash_mode = qio\n"
            "board_build.memory_type = qio_opi\n"
            "board_build.psram_type = opi\n"
            "board_build.partitions = partitions.csv\n"
            "lib_deps =\n"
            "  zinggjm/GxEPD2@1.6.4\n"
            "  adafruit/Adafruit GFX Library@1.12.6\n"
            "  adafruit/Adafruit BusIO@1.17.4\n"
            "build_flags = -DFRAME_HW_ALFRED_V1_2=1\n")
          PY
          pio run -d frame/tests/news_v4_bw_grid/arduino-verify-pio -e verify
      - name: Verify numbered layouts, grid, themes, original fonts and no OTA
        run: |
          grep -q 'gSelection-1)/4+1' frame/tests/news_v4_bw_grid/src/main.cpp
          grep -q 'gSelection-1)%4+1' frame/tests/news_v4_bw_grid/src/main.cpp
          grep -q 'drawGuide(active,ink)' frame/tests/news_v4_bw_grid/src/main.cpp
          grep -q 'cmd=="L"' frame/tests/news_v4_bw_grid/src/main.cpp
          grep -q 'cmd=="D"' frame/tests/news_v4_bw_grid/src/main.cpp
          grep -q 'newsEditorialLozenge' frame/tests/news_v4_bw_grid/arduino-package/frame_v2.5.1/NewsEditorialPreview.h
          test -s frame/tests/news_v4_bw_grid/arduino-package/frame_v2.5.1/frame_v2.5.1.ino
          test -s frame/tests/news_v4_bw_grid/arduino-package/frame_v2.5.1/partitions.csv
          echo "Only compiled. NO device upload, erase flash or OTA."
      - name: Upload ONE familiar Arduino source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RE_MIND_NEWS_R2_16_GRID_LIGHT_DARK_ARDUINO_V4_QA
          path: frame/tests/news_v4_bw_grid/arduino-package/
          if-no-files-found: error
          retention-days: 14
