name: Editorial visual identity build
on:
  push:
    branches:
      - feat/editorial-visual-identity
    paths:
      - "app/editorial-lab/**"
      - "app/lib/editorialIdentity.mjs"
      - "app/lib/editorialPdfExport.mjs"
      - "package.json"
      - "tests/editorial-typeface-identity.test.mjs"
      - ".github/workflows/editorial-visual-identity.yml"
  workflow_dispatch:
jobs:
  editorial-typefaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without changing project lockfiles
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run typography and PDF structure tests
        run: node --test tests/editorial-typeface-identity.test.mjs tests/editorial-pdf-export.test.mjs
      - name: Typecheck Layout Lab
        run: npm run typecheck
      - name: Build staging app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install ephemeral Chromium for actual typography measurements
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start Layout Lab
        run: |
          (npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/editorial-fonts-next.log 2>&1 &)
      - name: Audit actual font glyph clipping across all grid shapes
        run: node scripts/editorial-browser-audit.mjs
      - name: Save rendered font previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-typography-visual-review
          path: artifacts/editorial/
          if-no-files-found: ignore
      - name: Print server errors
        if: failure()
        run: tail -120 /tmp/editorial-fonts-next.log || true
