name: Temporary Fnugg resort verifier

on:
  push:
    branches:
      - fix/ski-fnugg-resort-status

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Fnugg resort patch
        run: python .github/scripts/temp_fnugg_patch.py
      - name: Install dependencies for verification
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Smoke-test Fnugg matching logic
        run: |
          node <<'NODE'
          async function nearest(label, lat, lon) {
            const url = new URL('https://api.fnugg.no/geodata/getnearest')
            url.searchParams.set('lat', String(lat))
            url.searchParams.set('lon', String(lon))
            url.searchParams.set('distance', '30')
            url.searchParams.set('sourceFields', 'id,name,site_path,resort_open,opening_hours,lifts,slopes,last_updated')
            const response = await fetch(url)
            const payload = await response.json()
            const hits = Array.isArray(payload?.hits?.hits) ? payload.hits.hits : []
            const candidate = hits.find((hit) => {
              const source = hit?._source || {}
              const name = String(source.name || '').trim()
              if (!name || /(sommer|summer|bike)/i.test(name)) return false
              const lifts = Number(source?.lifts?.count || 0)
              const slopes = Number(source?.slopes?.count || 0)
              return lifts >= 2 || slopes >= 2
            })
            if (!response.ok || !candidate?._source) throw new Error(`${label}: no matched resort`)
            console.log(label, JSON.stringify({
              name: candidate._source.name,
              lifts: `${candidate._source?.lifts?.open}/${candidate._source?.lifts?.count}`,
              slopes: `${candidate._source?.slopes?.open}/${candidate._source?.slopes?.count}`,
              distance_m: candidate.sort?.[0],
            }))
          }
          await nearest('Hovden', 59.56, 7.36)
          await nearest('Voss', 60.63, 6.42)
          NODE
      - name: Commit verified change and remove temporary files
        run: |
          rm -f .github/workflows/temp-fnugg-inspect.yml .github/scripts/temp_fnugg_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/HomePageClient.tsx app/api/ski/summary/route.ts .github/workflows/temp-fnugg-inspect.yml .github/scripts/temp_fnugg_patch.py
          git commit -m "Add Fnugg resort status to Ski"
          git push
