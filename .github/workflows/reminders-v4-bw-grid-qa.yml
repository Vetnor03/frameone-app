name: Reminders V4 B-W grid 16 SERIAL Arduino QA (NO FLASH)

on:
  pull_request:
    paths:
      - "frame/tests/reminders_v4_bw_grid/**"
      - "frame/src/modules/RemindersEditorialPreview.h"
      - ".github/workflows/reminders-v4-bw-grid-qa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Compile original black/white GxEPD2 test source
        run: pio run -d frame/tests/reminders_v4_bw_grid -e v4_bw_grid
      - name: Package familiar Arduino IDE sketch
        run: python frame/tests/reminders_v4_bw_grid/package_arduino.py
      - name: Compile packaged Arduino source independently
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2, rmtree
          root=Path("frame/tests/reminders_v4_bw_grid")
          src=root/"arduino-package/frame_v2.5.1"
          verify=root/"arduino-verify-pio"
          if verify.exists():rmtree(verify)
          (verify/"boards").mkdir(parents=True)
          (verify/"src").mkdir()
          copy2("frame/boards/alfred_v1_2.json",verify/"boards/alfred_v1_2.json")
          copy2(src/"partitions.csv",verify/"partitions.csv")
          for file in src.iterdir():
            if file.suffix in {".cpp",".h"}:
              copy2(file,verify/"src"/file.name)
          (verify/"src/main.cpp").write_text((src/"frame_v2.5.1.ino").read_text())
          (verify/"platformio.ini").write_text(
            "[platformio]\n"
            "default_envs = verify\n"
            "boards_dir = boards\n"
            "[env:verify]\n"
            "platform = espressif32@6.6.0\n"
            "framework = arduino\n"
            "board = alfred_v1_2\n"
            "board_build.flash_size = 16MB\n"
            "board_build.flash_mode = qio\n"
            "board_build.memory_type = qio_opi\n"
            "board_build.psram_type = opi\n"
            "board_build.partitions = partitions.csv\n"
            "lib_deps =\n"
            "  zinggjm/GxEPD2@1.6.4\n"
            "  adafruit/Adafruit GFX Library@1.12.6\n"
            "  adafruit/Adafruit BusIO@1.17.4\n"
            "build_flags = -DFRAME_HW_ALFRED_V1_2=1\n")
          PY
          pio run -d frame/tests/reminders_v4_bw_grid/arduino-verify-pio -e verify
      - name: Verify 16-size mapping and 4x4 visible grid
        run: |
          grep -q 'gSelection-1)/4+1' frame/tests/reminders_v4_bw_grid/src/main.cpp
          grep -q 'gSelection-1)%4+1' frame/tests/reminders_v4_bw_grid/src/main.cpp
          grep -q 'drawGrid(c)' frame/tests/reminders_v4_bw_grid/src/main.cpp
          grep -q 'cmd=="D"' frame/tests/reminders_v4_bw_grid/src/main.cpp
          test -s frame/tests/reminders_v4_bw_grid/arduino-package/frame_v2.5.1/frame_v2.5.1.ino
          echo "Build only; no device flashed, no OTA deployed."
      - name: Upload one Surf-style Arduino sketch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RE_MIND_REMINDERS_16_SERIAL_GRID_LIGHT_DARK_QA
          path: frame/tests/reminders_v4_bw_grid/arduino-package/
          if-no-files-found: error
          retention-days: 14
