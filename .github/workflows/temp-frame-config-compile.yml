name: Temporary pinned firmware verifier

on:
  push:
    branches:
      - fix/frame-config-transient-resilience

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install known-good PlatformIO
        run: pip install "platformio==6.1.19" pytest
      - name: Run firmware tests
        run: pytest -q frame/tests
      - name: Compile Alfred production target
        run: pio run -v -d frame -e alfred_v1_2
      - name: Compile refresh-audit target
        run: pio run -d frame -e alfred_v1_2_refresh_audit
      - name: Compile legacy frame target
        run: pio run -d frame -e frame_esp32
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install pinned Arduino toolchain
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "GxEPD2@1.6.4"
      - name: Prepare flat Arduino IDE sketch
        run: python frame/tools/prepare_arduino_sketch.py --output "$RUNNER_TEMP/frame_v2.5.1"
      - name: Compile production ESP32-S3 sketch with Arduino CLI
        run: |
          arduino-cli compile --verbose --warnings default --export-binaries \
            --fqbn "esp32:esp32:esp32s3:CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=min_spiffs,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            "$RUNNER_TEMP/frame_v2.5.1"
      - name: Remove temporary verifier
        if: success()
        run: |
          rm -f .github/workflows/temp-frame-config-compile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-frame-config-compile.yml
          git commit -m "Remove temporary pinned firmware verifier"
          git push
