name: Editorial browser geometry
on:
  pull_request:
    paths:
      - 'app/editorial-lab/**'
      - 'app/lib/editorialComposition.mjs'
      - 'app/lib/editorialFrameLayout.mjs'
      - 'scripts/editorial-browser-audit.mjs'
      - '.github/workflows/editorial-layout-visual.yml'
  workflow_dispatch:
jobs:
  editorial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install ephemeral Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start editorial preview
        run: |
          (npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/editorial-next.log 2>&1 &)
      - name: Audit every module/grid/theme and capture regressions
        run: node scripts/editorial-browser-audit.mjs
      - name: Upload review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-geometry-review
          path: artifacts/editorial/
          if-no-files-found: ignore
      - name: Print server diagnostics on failure
        if: failure()
        run: tail -100 /tmp/editorial-next.log || true
