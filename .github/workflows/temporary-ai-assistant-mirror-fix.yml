name: Apply AI Assistant mirror parser fix

on:
  push:
    branches:
      - agent/fix-ai-assistant-mirror-parser

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ai-assistant-mirror-parser
          fetch-depth: 0

      - name: Apply minimal parser fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('app/api/device/mirror-snapshot/route.ts')
          route = route_path.read_text()
          old = "const MODULES = new Set(['date', 'weather', 'surf', 'reminders', 'countdown', 'soccer', 'stocks', 'groceries'])"
          new = "const MODULES = new Set(['assistant', 'date', 'weather', 'surf', 'reminders', 'countdown', 'soccer', 'stocks', 'groceries'])"
          if old not in route:
              raise SystemExit('Expected mirror module registry was not found')
          route_path.write_text(route.replace(old, new, 1))

          test_path = Path('tests/ai-assistant-mirror-view.test.mjs')
          test_text = test_path.read_text()
          marker = "test('mirror snapshot module parser accepts the assistant module key'"
          if marker not in test_text:
              test_text += """

test('mirror snapshot module parser accepts the assistant module key', () => {
  assert.match(route, /const MODULES = new Set\(\[[^\]]*'assistant'/)
  assert.match(route, /else if \(parsed\.base === 'assistant'\)/)
})
"""
              test_path.write_text(test_text)

          Path('.github/workflows/temporary-ai-assistant-mirror-fix.yml').unlink()
          PY

      - name: Run targeted tests
        run: node --test tests/ai-assistant-module-selection.test.mjs tests/ai-assistant-mirror-view.test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/device/mirror-snapshot/route.ts tests/ai-assistant-mirror-view.test.mjs .github/workflows/temporary-ai-assistant-mirror-fix.yml
          git commit -m "Fix AI Assistant mirror module parsing"
          git push origin HEAD:agent/fix-ai-assistant-mirror-parser
