; Reproducible candidate profile. Hardware assumptions marked below MUST be
; confirmed against a production frame before this profile is used to publish OTA.
[platformio]
default_envs = alfred_v1_2
src_dir = src

[env:frame_esp32]
platform = espressif32@6.6.0 ; Arduino-ESP32 2.0.14
framework = arduino
board = esp32dev              ; MANUAL CONFIRMATION: exact production board/MCU
board_build.flash_size = 4MB  ; MANUAL CONFIRMATION: production flash capacity
board_build.partitions = min_spiffs.csv ; dual-app OTA, MANUAL CONFIRMATION
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  zinggjm/GxEPD2@1.6.4
build_src_filter = +<*> 
build_flags =
  -I src/core
  -I src/device
  -I src/display
  -I src/modules
  -I src/network
  -I src/assets/fonts
  -I src/assets/icons
  -Wl,-Map,.pio/build/frame_esp32/firmware.map

[env:alfred_v1_2]
; The standard Alfred build includes the authenticated MQTT notifier.
; TEMP_REFRESH_AUDIT diagnostic activation: add -DTEMP_REFRESH_AUDIT_ENABLED=1
; under build_flags below for the temporary Alfred field build; leave absent otherwise.
platform = espressif32@6.6.0
framework = arduino
board = alfred_v1_2
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.partitions = partitions_alfred_16mb.csv
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  zinggjm/GxEPD2@1.6.4
  knolleary/PubSubClient@2.8
build_src_filter = +<*>
build_flags =
  -DFRAME_HW_ALFRED_V1_2=1
  -I src/core
  -I src/device
  -I src/display
  -I src/modules
  -I src/network
  -I src/assets/fonts
  -I src/assets/icons
  -Wl,-Map,.pio/build/alfred_v1_2/firmware.map

; TEMP_REFRESH_AUDIT: explicit opt-in Alfred diagnostic firmware. This target is
; not a default/production build; use `pio run -e alfred_v1_2_refresh_audit`.
[env:alfred_v1_2_refresh_audit]
extends = env:alfred_v1_2
build_flags =
  ${env:alfred_v1_2.build_flags}
  -DTEMP_REFRESH_AUDIT_ENABLED=1

; F3 DESIGN vNext: preview-only. NOT standard firmware / not an OTA target.
; Enable Date Fraunces/DM Sans only in this explicit, separately named build.
; The default `alfred_v1_2` build above has REMIND_F3_DATE_PREVIEW_ENABLED=0.
[env:alfred_v1_2_date_preview]
extends = env:alfred_v1_2
build_flags =
  ${env:alfred_v1_2.build_flags}
  -DREMIND_F3_DATE_PREVIEW_ENABLED=1

; R2A Date micro (1x1) experimental build. Standard and F3-only builds stay unchanged.
; Explicitly enable both prior F3 editorial engine and new micro branch.
[env:alfred_v1_2_date_micro_preview]
extends = env:alfred_v1_2_date_preview
build_flags =
  ${env:alfred_v1_2_date_preview.build_flags}
  -DREMIND_R2A_DATE_MICRO_ENABLED=1
