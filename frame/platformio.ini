; Reproducible candidate profile. Hardware assumptions marked below MUST be
; confirmed against a production frame before this profile is used to publish OTA.
[platformio]
default_envs = frame_esp32
src_dir = src

[env:frame_esp32]
platform = espressif32@6.6.0 ; Arduino-ESP32 2.0.17
framework = arduino
board = esp32dev              ; MANUAL CONFIRMATION: exact production board/MCU
board_build.flash_size = 4MB  ; MANUAL CONFIRMATION: production flash capacity
board_build.partitions = min_spiffs.csv ; dual-app OTA, MANUAL CONFIRMATION
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  zinggjm/GxEPD2@1.6.4
build_src_filter = +<*> 
build_flags =
  -I src/core
  -I src/device
  -I src/display
  -I src/modules
  -I src/network
  -I src/assets/fonts
  -I src/assets/icons
  -Wl,-Map,.pio/build/frame_esp32/firmware.map
