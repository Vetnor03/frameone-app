; Isolated, manually flashed V4 grayscale/Reminders DESIGN QA ONLY.
; Not a production environment. Never included in standard frame build/OTA.
[platformio]
default_envs = v4_gray_qa
src_dir = src
boards_dir = ../../boards

[env:v4_gray_qa]
platform = espressif32@6.6.0
framework = arduino
board = alfred_v1_2
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.partitions = ../../partitions_alfred_16mb.csv
monitor_speed = 115200
lib_deps =
  https://github.com/ZinggJM/GxEPD2_4G.git#de006169dba1d905f618d70423f0e1a9215b20c7
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
build_flags =
  -DFRAME_HW_ALFRED_V1_2=1
  -DREMINDERS_V4_TRUE_GREYSCALE_QA=1
  -I../../../src/assets/fonts
  -I../../../src/modules
  -I../../../src/device
