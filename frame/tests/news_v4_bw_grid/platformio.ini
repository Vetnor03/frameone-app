; RE:MIND News R2 – independent V4 black/white grid physical QA.
; CI ONLY builds. Does not upload, erase flash, trigger OTA or modify NVS.
[platformio]
default_envs = news_v4_bw_grid
src_dir = src
boards_dir = ../../boards

[env:news_v4_bw_grid]
platform = espressif32@6.6.0
framework = arduino
board = alfred_v1_2
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.partitions = ../../partitions_alfred_16mb.csv
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@1.6.4
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
build_flags =
  -DFRAME_HW_ALFRED_V1_2=1
  -I../../../src/assets/fonts
  -I../../../src/modules
  -I../../../src/device
